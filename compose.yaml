
services:
  api:
    build: .
    container_name: url-shortener-api-container
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: host.docker.internal
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: url-shortener-compose-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
